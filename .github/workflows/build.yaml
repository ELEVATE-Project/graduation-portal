name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - "release-1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.21.1
        uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.TEKDI_USERNAME }}
          password: ${{ secrets.TEKDI_PASSWORD }}

      - name: Build Docker Image
        run: |
          echo "Building Docker image: ${{ secrets.TEKDI_REPO }}"
          docker build -t ${{ secrets.TEKDI_REPO }} .

      - name: Push Docker Image
        run: |
          echo "Pushing Docker image: ${{ secrets.TEKDI_REPO }}"
          docker push ${{ secrets.TEKDI_REPO }}

      - name: Cleanup Docker Images
        run: |
          docker image prune -af
          docker container prune -f
